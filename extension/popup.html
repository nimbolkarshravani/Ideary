<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ideary</title>
    <style>
      :root {
        --ink: #8b2447;
        --body: #3d2530;
        --pink: #ffd9e5;
        --paper: #fffafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 280px;
        margin: 0;
        padding: 20px;
        background: var(--paper);
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--body);
      }

      h1 {
        margin: 0 0 4px;
        font-size: 26px;
        color: var(--ink);
        font-family: "Comic Sans MS", "Segoe Print", cursive;
        letter-spacing: 0.5px;
      }

      .tagline {
        margin: 0 0 18px;
        font-size: 12px;
        opacity: 0.6;
      }

      button {
        width: 100%;
        padding: 12px;
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
        background: var(--pink);
        border: 1.5px solid var(--ink);
        border-radius: 14px;
        cursor: pointer;
        transition: transform 0.05s ease, opacity 0.15s ease;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      button:disabled {
        cursor: default;
        opacity: 0.45;
        background: #f3eef0;
      }

      #status {
        margin-top: 16px;
        font-size: 13px;
        line-height: 1.5;
        min-height: 18px;
      }

      #status.loading {
        color: var(--body);
        opacity: 0.7;
        font-style: italic;
      }

      #status.success {
        color: #2e7d32;
      }

      #status.error {
        color: #c0392b;
      }

      #status a {
        display: inline-block;
        margin-top: 6px;
        color: var(--ink);
        font-weight: 600;
        text-decoration: none;
      }

      #status a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <h1>Ideary</h1>
    <p class="tagline">turn a conversation into a Eureka</p>

    <button id="capture">💡 Save as Eureka</button>

    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
